name: Consensus Subsystem CI

on:
  push:
    branches: [main]
    paths:
      - 'native/consensus/**'
      - 'research/eval/**'
      - '.github/workflows/consensus-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'native/consensus/**'
      - 'research/eval/**'
      - '.github/workflows/consensus-ci.yml'

jobs:
  test-rust-consensus:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Native Consensus Tests
        run: cargo test --manifest-path native/consensus/Cargo.toml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Research Eval Scripts
        run: python -m py_compile research/eval/run_baseline.py research/eval/run_consensus.py research/eval/score.py
